<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Machine Learning: Computer Project</title>
<meta name="description" content="Machine learning explained as a pixel platformer game, by Muhammad Sameh.">
<meta property="og:title" content="Machine Learning: Computer Project">
<meta property="og:description" content="Machine learning explained as a pixel platformer game, by Muhammad Sameh.">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --sky1: #4a80f0; --sky2: #5c94fc; --sky3: #6fa3ff; --sky4: #86b3ff;
  --ink: #111111; --white: #ffffff; --gold: #ffd23f; --red: #c0392b; --red2: #e83b3b;
  --grass: #58c048; --grass2: #2e8b2e; --dirt: #c8763c; --dirt2: #8a4b22;
  --u: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Press Start 2P", monospace; color: var(--white); background: var(--sky2);
  image-rendering: pixelated; line-height: 1.6; overflow-x: hidden;
}
.sky {
  position: relative; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 120px 16px 220px; overflow: hidden;
  background: linear-gradient(var(--sky1) 0 25%, var(--sky2) 25% 50%, var(--sky3) 50% 75%, var(--sky4) 75% 100%);
}
.cloud { position: absolute; width: 168px; height: 72px; animation: drift linear infinite; }
.cloud::before, .cloud::after, .cloud i { content: ""; position: absolute; background: var(--white); }
.cloud::before { left: 0; top: 24px; width: 168px; height: 40px; }
.cloud::after { left: 24px; top: 0; width: 64px; height: 40px; }
.cloud i { left: 80px; top: 8px; width: 56px; height: 40px; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(calc(100vw + 220px)); } }
.c1 { top: 12%; animation-duration: 60s; animation-delay: -10s; }
.c2 { top: 30%; animation-duration: 80s; animation-delay: -45s; transform: scale(.8); }
.c3 { top: 8%; animation-duration: 70s; animation-delay: -30s; }
.c4 { top: 45%; animation-duration: 95s; animation-delay: -70s; }

.title {
  position: relative; z-index: 2; text-align: center; background: var(--red);
  border: 10px solid var(--ink); box-shadow: 12px 12px 0 rgba(0,0,0,.35), inset 0 10px 0 rgba(255,255,255,.22);
  padding: 40px 32px 32px; max-width: 1100px; width: 100%;
}
.title .tag { font-size: clamp(10px, 1.6vw, 16px); color: var(--gold); letter-spacing: 2px; margin-bottom: 20px; }
.title h1 { font-size: clamp(26px, 6.4vw, 80px); line-height: 1.25; font-weight: 400; text-shadow: 8px 8px 0 var(--ink); }
.title h1 .y { color: var(--gold); display: block; }
.title p { margin-top: 24px; font-size: clamp(12px, 2vw, 22px); color: var(--white); text-shadow: 4px 4px 0 var(--ink); }
.scroll {
  position: relative; z-index: 2; margin-top: 56px; font-size: clamp(12px, 1.6vw, 18px); color: var(--white);
  text-decoration: none; text-shadow: 4px 4px 0 var(--ink); animation: blink 1.1s steps(2) infinite;
}
.scroll:focus-visible { outline: 4px dashed var(--gold); outline-offset: 8px; }
@keyframes blink { 50% { opacity: 0; } }

.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
  background:
    linear-gradient(var(--grass) 0 16px, var(--grass2) 16px 24px, transparent 24px),
    repeating-linear-gradient(90deg, transparent 0 60px, var(--dirt2) 60px 64px),
    repeating-linear-gradient(transparent 0 44px, var(--dirt2) 44px 48px),
    var(--dirt);
}
.hill { position: absolute; bottom: 160px; width: 0; height: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-bottom: 140px solid #3fa84a; }
.h1 { left: 6%; } .h2 { left: 58%; border-bottom-width: 200px; border-left-width: 200px; border-right-width: 200px; } .h3 { left: 30%; border-bottom-width: 100px; }
.runner {
  position: absolute; bottom: 160px; left: 0; width: 144px; height: 216px; z-index: 1;
  background: url(hero_run1.png) 0 0 / 100% 100% no-repeat; image-rendering: pixelated;
  animation: run 12s linear infinite, legs .2s steps(1) infinite;
}
@keyframes run { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 160px)); } }
@keyframes legs { 50% { background-image: url(hero_run2.png); } }

.level { background: #1a1030; padding: 96px 16px 120px; text-align: center; }
.level h2 { font-size: clamp(16px, 3vw, 36px); font-weight: 400; color: var(--gold); text-shadow: 6px 6px 0 var(--ink); }
.level .sub { margin: 16px auto 48px; max-width: 760px; font-size: clamp(10px, 1.4vw, 14px); color: #c9c2e8; line-height: 2; }

.screen {
  position: relative; max-width: 1100px; margin: 0 auto; border: 10px solid var(--ink); background: #000;
  box-shadow: 0 0 0 8px var(--gold), 16px 16px 0 8px rgba(0,0,0,.5);
}
.screen video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
.start {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0; cursor: pointer;
  background: url(poster.jpg) center / cover no-repeat; display: flex; align-items: center; justify-content: center;
  font-family: inherit; color: var(--white);
}
.start::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); transition: background .15s; }
.start span {
  position: relative; background: var(--red2); border: 8px solid var(--ink); padding: 24px 32px;
  font-size: clamp(14px, 2.6vw, 28px); box-shadow: 8px 8px 0 var(--ink); transition: transform .1s;
}
.start:hover::before { background: rgba(0,0,0,.15); }
.start:hover span { transform: translate(-3px, -3px); box-shadow: 11px 11px 0 var(--ink); }
.start:active span { transform: translate(4px, 4px); box-shadow: 4px 4px 0 var(--ink); }
.start:focus-visible { outline: 6px dashed var(--gold); outline-offset: -14px; }
.start[hidden] { display: none; }
.hint { margin-top: 32px; font-size: 11px; color: #9a92c0; }

footer { background: var(--dirt); border-top: 16px solid var(--grass); padding: 32px 16px; text-align: center; font-size: 11px; color: var(--white); text-shadow: 3px 3px 0 var(--dirt2); }

@media (max-width: 640px) {
  .title { border-width: 6px; padding: 28px 16px 24px; }
  .runner { width: 96px; height: 144px; }
  .hill { display: none; }
  .screen { border-width: 6px; box-shadow: 0 0 0 5px var(--gold); }
  .start span { border-width: 5px; padding: 16px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .cloud, .runner, .scroll { animation: none; }
  .runner { transform: translateX(10vw); background-image: url(hero_idle.png); }
}
</style>
</head>
<body>
<header class="sky">
  <div class="cloud c1" aria-hidden="true"><i></i></div>
  <div class="cloud c2" aria-hidden="true"><i></i></div>
  <div class="cloud c3" aria-hidden="true"><i></i></div>
  <div class="cloud c4" aria-hidden="true"><i></i></div>
  <div class="title">
    <div class="tag">COMPUTER PROJECT: AI</div>
    <h1><span class="y">MACHINE LEARNING</span>COMPUTER PROJECT</h1>
    <p>BY MUHAMMAD SAMEH</p>
  </div>
  <a class="scroll" href="#watch">▼ SCROLL DOWN ▼</a>
  <div class="hill h1" aria-hidden="true"></div><div class="hill h2" aria-hidden="true"></div><div class="hill h3" aria-hidden="true"></div>
  <div class="runner" role="img" aria-label="Pixel character of Muhammad running"></div>
  <div class="ground" aria-hidden="true"></div>
</header>

<main class="level" id="watch">
  <h2>LEVEL 1: PLAY THE VIDEO</h2>
  <p class="sub">MACHINE LEARNING EXPLAINED AS A GAME: DATA, TRAINING, LOSS, OVERFITTING AND THE MODEL.</p>
  <div class="screen">
    <video id="vid" src="ml-game.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
    <button class="start" id="start" type="button" aria-label="Play the video full screen"><span>▶ PRESS START</span></button>
  </div>
  <p class="hint">CLICK TO PLAY FULL SCREEN · PRESS ESC TO EXIT</p>
</main>

<footer>MUHAMMAD SAMEH · COMPUTER PROJECT: AI · 2026</footer>
<script src="app.js"></script>
</body>
</html>
